# inbox.txt — the site is the repo root: static files, no build step.
# package.json exists only so the tokenizer function gets its dependency installed.

[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/example.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ── Machine-readable entry points ──────────────────────────────
# Served as UTF-8 plain text so a model fetching them gets text, not a download.

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/humans.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/.well-known/security.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/og.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Convenience aliases — an agent guessing a path should land somewhere useful
# rather than on a 404.
[[redirects]]
  from = "/llms"
  to = "/llms.txt"
  status = 301

[[redirects]]
  from = "/spec"
  to = "https://github.com/eddie-boop14/inbox-txt/blob/main/SPEC.md"
  status = 302

[[redirects]]
  from = "/security.txt"
  to = "/.well-known/security.txt"
  status = 301
